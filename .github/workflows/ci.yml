name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Mise.slnx
      - run: dotnet build Mise.slnx -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          # include-hidden-files: upload-artifact v4.4+ drops dot-prefixed paths by default
          # (a 2024 security hardening) — that silently strips Mise.E2ETests'
          # bin/Release/net10.0/.playwright/ driver assets, which is exactly the "assembly
          # was found, but is missing required assets" failure the e2e-tests job hit.
          include-hidden-files: true
          path: |
            **/bin/Release/**
            **/obj/Release/**

  architecture-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Restore the executable bit on test apphosts
        # actions/upload-artifact zips (and download-artifact unzips) without preserving
        # Unix file permissions, so xUnit v3's own compiled apphost binary — the thing its
        # out-of-process runner directly execve()s, not `dotnet exec <dll>` — comes back
        # non-executable and fails with "Permission denied" before any test runs.
        run: chmod +x tests/*/bin/Release/net10.0/Mise.*Tests
      - run: >
          dotnet test tests/Mise.ArchitectureTests/Mise.ArchitectureTests.csproj
          -c Release --no-build --filter "Category=Architecture"

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Restore the executable bit on test apphosts
        run: chmod +x tests/*/bin/Release/net10.0/Mise.*Tests
      - run: dotnet tool restore
      # Runs its own dotnet test (with --collect, so --no-build wouldn't apply cleanly
      # alongside coverlet.collector) and enforces the tiered coverage gate — see
      # scripts/coverage.ps1's own header comment for what "gated" means today.
      - shell: pwsh
        run: ./scripts/coverage.ps1

  client-unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Restore the executable bit on test apphosts
        run: chmod +x tests/*/bin/Release/net10.0/Mise.*Tests
      - run: >
          dotnet test tests/Mise.Client.UnitTests/Mise.Client.UnitTests.csproj
          -c Release --no-build

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Restore the executable bit on test apphosts
        run: chmod +x tests/*/bin/Release/net10.0/Mise.*Tests
      # WebTests.cs boots the real AppHost via DistributedApplicationTestingBuilder, which
      # needs Aspire's DCP orchestrator binary. DCP isn't in the downloaded build-output
      # artifact (bin/obj only) — it's provisioned as a side effect of restore, into
      # ~/.aspire on *this* runner's own disk, which is a fresh VM the `build` job's restore
      # never touched. Restoring again here is otherwise redundant (packages already built)
      # but is what actually provisions DCP where this job can find it.
      - run: dotnet restore Mise.slnx
      # No services: block — Testcontainers starts and owns its own PostgreSQL container;
      # ubuntu-latest already has Docker running.
      - run: >
          dotnet test tests/Mise.IntegrationTests/Mise.IntegrationTests.csproj
          -c Release --no-build --filter "Category=Integration"

  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Restore the executable bit on test apphosts
        run: chmod +x tests/*/bin/Release/net10.0/Mise.*Tests
      - name: Install Playwright browsers
        shell: pwsh
        run: ./tests/Mise.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: >
          dotnet test tests/Mise.E2ETests/Mise.E2ETests.csproj
          -c Release --no-build --filter "Category=E2E"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: '**/playwright-traces/**'
          retention-days: 7

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Mise.slnx
      - run: dotnet format Mise.slnx --verify-no-changes --no-restore --severity warn

  dependency-audit:
    runs-on: ubuntu-latest
    # security-events: write is required by codeql-action/upload-sarif — the default
    # GITHUB_TOKEN is read-only unless a job explicitly asks for more, so without this the
    # upload step fails with "Resource not accessible by integration" even though the scan
    # itself succeeded. contents: read is the (otherwise-implicit) permission checkout needs.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Pinned by commit SHA, not a mutable tag: aquasecurity/trivy-action suffered two
        # real supply-chain compromises in 2026 (repo takeover via a stolen PAT, then a
        # second incident where every existing tag — 0.0.1 through 0.34.2 — was repointed
        # at a malicious commit for several hours). v0.35.0 was the first clean release
        # after remediation; v0.36.0 (pinned below) is the current release after that.
        # Never relax this back to a bare version tag for this action.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action calls the GitHub API to comment on the PR with any finding, so it
    # needs pull-requests: write in addition to the contents: read checkout needs — the
    # same "default token is read-only" gap as dependency-audit's security-events: write.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the .dockerignore already keeps .git so Gitleaks can scan it
      # No GITLEAKS_LICENSE needed: this repo is under a personal GitHub account, and
      # gitleaks-action's license requirement (since v2.0.0) applies only to repos owned by
      # an organization account. Pinned by SHA for the same supply-chain reason as Trivy
      # above — a third-party security-scanning action is exactly the kind of dependency
      # worth pinning tightly, tag-mutation attacks on this class of action are a real,
      # observed pattern this year, not a hypothetical.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    if: always()
    needs:
      - build
      - architecture-tests
      - unit-tests
      - client-unit-tests
      - integration-tests
      - e2e-tests
      - format-check
      - dependency-audit
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or been skipped
        run: |
          echo '${{ toJson(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qv -E '^(success|skipped| )*$'; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
